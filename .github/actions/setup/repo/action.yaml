name: 'Setup PNPM and Install'
description: 'Setup node environment and pnpm via corepack'
inputs:
  node_version:
    required: true
    description: (Major) Node version to use
  skip_install:
    required: false
    description: 'Skip installing dependencies'

runs:
  using: 'composite'
  steps:
    # corepack must run before setup-node: `cache: 'pnpm'` calls pnpm to locate
    # the store, so pnpm has to be on PATH already.
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'pnpm'
        # Private @collegeboard-software packages (nimbus-sst) live on GitHub
        # Packages. setup-node writes a user .npmrc that reads NODE_AUTH_TOKEN.
        registry-url: 'https://npm.pkg.github.com'
        scope: '@collegeboard-software'
    - if: '${{ !inputs.skip_install }}'
      run: pnpm i --frozen-lockfile
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
