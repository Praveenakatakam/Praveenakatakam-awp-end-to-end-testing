name: On Release to Main
on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

jobs:
  release:
    if: ${{ vars.RELEASE_STRATEGY == 'ON_DEMAND' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup/repo
        with:
          node_version: ${{ vars.NODE_MAJOR_VERSION }}
          pnpm_version: ${{ vars.PNPM_VERSION }}
      - name: Run Release
        run: pnpm run release
        shell: bash
