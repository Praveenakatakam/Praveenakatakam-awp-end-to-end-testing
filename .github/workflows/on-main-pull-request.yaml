name: On Pull Request to Main
on:
  pull_request:
    branches:
      - 'main'
permissions:
  id-token: write
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup/repo
        with:
          node_version: ${{ vars.NODE_MAJOR_VERSION }}
          pnpm_version: ${{ vars.PNPM_VERSION }}
      - name: Format Check
        run: pnpm run format:check
        shell: bash
      - name: Lint
        run: pnpm run lint
        shell: bash
      - name: Typecheck
        run: pnpm run typecheck
        shell: bash
      - name: Build
        run: pnpm run build
        shell: bash
      - name: Unit Test
        run: pnpm run test:unit
        shell: bash
