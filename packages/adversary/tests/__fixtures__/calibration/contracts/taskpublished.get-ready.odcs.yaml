version: 1.0.0
apiVersion: v3.1.0
kind: DataContract
id: urn:bawp:get-ready:assignments-api
name: Get Ready Assignments API
status: active
domain: get-ready
schema:
  - name: TaskPublished
    logicalType: object
    properties:
      - name: id
        logicalType: string
        required: true
      - name: title
        logicalType: string
        required: true
      - name: description
        logicalType: string
        required: true
      - name: type
        logicalType: string
        required: true
        quality:
          - type: library
            metric: invalidValues
            mustBe: 0
            arguments:
              validValues: [practice, quiz, homework, classwork, assessment]
      - name: duration
        logicalType: integer
        required: true
      - name: totalItemCount
        logicalType: integer
        required: true
      - name: itemTypes
        logicalType: array
        required: true
      - name: standards
        logicalType: array
        required: true
