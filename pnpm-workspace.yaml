packages:
  - 'packages/*'
  - 'scripts'

# Link internal "@registry/*" deps (declared with "*") to local workspace
# packages instead of fetching from the registry. npm workspaces did this by
# default; pnpm 10 defaults link-workspace-packages to false.
linkWorkspacePackages: true

# Security overrides — pin transitive deps to patched versions.
# pnpm reads overrides from here (or pnpm.overrides in package.json), NOT from
# npm's top-level "overrides" field. Nested npm overrides ({ "sst": { ... } })
# are expressed with pnpm's "parent>child" selector syntax.
overrides:
  '@aws-sdk/client-s3': '^3.1094.0'
  '@babel/core': 7.29.6
  '@babel/plugin-transform-modules-systemjs': 7.29.4
  '@babel/runtime': 7.26.10
  '@smithy/config-resolver': 4.4.0
  '@smithy/types': 4.15.1
  adm-zip: 0.6.0
  ajv: 8.18.0
  axios: 1.18.0
  cross-spawn: 7.0.6
  diff: 8.0.3
  esbuild: 0.25.0
  fast-jwt: 6.2.4
  fast-uri: 3.1.4
  fast-xml-parser: 5.10.1
  flatted: 3.4.2
  follow-redirects: 1.16.0
  form-data: 4.0.6
  kysely: 0.28.17
  micromatch: 4.0.8
  minimatch: 10.2.3
  picomatch: 2.3.2
  'sst>ajv': 8.18.0
  aws-cdk-lib: 2.238.0
  constructs: 10.3.0
  'sst>aws-cdk-lib': 2.238.0
  'sst>fast-uri': 3.1.4
  'sst>fast-xml-parser': 5.10.1
  'sst>kysely': 0.28.17
  tmp: 0.2.6
  undici: ^7.25.0
  uuid: 11.1.1
  yaml: 2.8.3
patchedDependencies:
  '@aws-cdk/toolkit-lib@1.1.1': patches/@aws-cdk__toolkit-lib@1.1.1.patch
  # Adds a certificateRef getter so CDK v2.238+ CloudFront Distribution can read
  # certificate.certificateRef.certificateId without crashing at synth; also
  # swaps deprecated @aws-sdk/* deps. Without this, `sst deploy` throws
  # "Cannot read properties of undefined (reading 'certificateId')".
  'sst@2.49.8': patches/sst@2.49.8.patch
  # Widen graphql peer ranges to include ^17.0.0. (graphql-yoga was originally
  # bundled into the sst patch, but pnpm 11 rejects cross-package paths, so it
  # lives in its own patch here.)
  'graphql-yoga@3.9.1': patches/graphql-yoga@3.9.1.patch
  '@envelop/validation-cache@5.1.3': patches/@envelop+validation-cache@5.1.3.patch

# Suppress peer-dependency mismatch warnings for packages that work with
# graphql 17 despite declaring older ranges. (Moved from package.json's
# pnpm.peerDependencyRules.)
peerDependencyRules:
  allowedVersions:
    'graphql-yoga>graphql': '17'
    '@envelop/validation-cache>graphql': '17'

# Dependencies allowed to run install/build lifecycle scripts. pnpm 11 blocks
# these by default and records the decision here (supersedes the pnpm 10
# onlyBuiltDependencies list). true = run the package's build scripts.
allowBuilds:
  aws-crt: true
  aws-sdk: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1094.0'
  - '@types/node@22.20.3'
